[package]
name = "gamja-artifact"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"

[lib]
name = "gamja_artifact"
path = "src/lib.rs"

[dependencies]
png = "0.17"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
